<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceRoom</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111214;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: min(430px, 92vw);
    background: #1e1f22;
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 15px 45px rgba(0,0,0,.45);
}

h1 {
    text-align: center;
    margin: 0 0 8px;
}

h2 {
    margin-bottom: 12px;
}

.subtitle {
    text-align: center;
    color: #b5bac1;
    margin-bottom: 28px;
}

label {
    display: block;
    margin: 16px 0 7px;
    font-size: 14px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #313338;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    outline: 2px solid #5865f2;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #5865f2;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.secondary {
    background: #4e5058;
}

.danger {
    background: #da373c;
}

.hidden {
    display: none;
}

.error {
    min-height: 20px;
    margin-top: 14px;
    text-align: center;
    color: #fa777c;
}

.success {
    color: #57f287;
}

.account {
    text-align: center;
}

.username {
    font-size: 26px;
    font-weight: 700;
    margin-top: 15px;
}

.id {
    color: #949ba4;
    font-size: 12px;
    word-break: break-all;
    margin-top: 5px;
}

.section {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid #3a3c41;
}

.friend {
    background: #313338;
    border-radius: 8px;
    padding: 12px;
    margin-top: 8px;
}

.friend button {
    margin-top: 10px;
}

.small {
    color: #949ba4;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="card">

<!-- LOGIN / REGISTER -->

<div id="authScreen">

    <h1>VoiceRoom</h1>

    <div class="subtitle">
        Your voice. Your friends. Your room.
    </div>

    <div id="loginForm">

        <label>Username</label>

        <input
            id="loginUsername"
            placeholder="your_username"
            autocomplete="username"
        >

        <label>Password</label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Your password"
            autocomplete="current-password"
        >

        <button onclick="login()">
            Log In
        </button>

        <button
            class="secondary"
            onclick="showRegister()"
        >
            Create Account
        </button>

    </div>


    <div id="registerForm" class="hidden">

        <label>Choose a username</label>

        <input
            id="registerUsername"
            placeholder="your_username"
            autocomplete="username"
        >

        <label>Password</label>

        <input
            id="registerPassword"
            type="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
        >

        <button onclick="register()">
            Create Account
        </button>

        <button
            class="secondary"
            onclick="showLogin()"
        >
            Back to Login
        </button>

    </div>

    <div id="authError" class="error"></div>

</div>


<!-- ACCOUNT -->

<div id="accountScreen" class="hidden">

    <div class="account">

        <h1>VoiceRoom</h1>

        <div
            class="username"
            id="myUsername"
        ></div>

        <div class="id">
            Account ID:
            <span id="myId"></span>
        </div>

    </div>


    <!-- ADD FRIEND -->

    <div class="section">

        <h2>Add Friend</h2>

        <div class="small">
            Enter someone's VoiceRoom username.
        </div>

        <input
            id="friendUsername"
            placeholder="username"
        >

        <button onclick="sendFriendRequest()">
            Send Friend Request
        </button>

        <div
            id="friendError"
            class="error"
        ></div>

    </div>


    <!-- FRIEND REQUESTS -->

    <div class="section">

        <h2>Friend Requests</h2>

        <div id="requests">
            <div class="small">
                No pending requests.
            </div>
        </div>

    </div>


    <!-- FRIENDS -->

    <div class="section">

        <h2>Friends</h2>

        <div id="friends">
            <div class="small">
                No friends yet.
            </div>
        </div>

    </div>


    <button
        class="danger"
        onclick="logout()"
    >
        Log Out
    </button>

</div>

</div>


<script>

const API = window.location.origin;


/* ==============================
   API
============================== */

async function api(endpoint, options = {}) {

    const token =
        localStorage.getItem("voiceroom_token");

    options.headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
    };

    if (token) {
        options.headers.Authorization =
            "Bearer " + token;
    }

    const response =
        await fetch(API + endpoint, options);

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error("Server returned an invalid response.");
    }

    if (!response.ok) {
        throw new Error(
            data.error || "Something went wrong."
        );
    }

    return data;
}


/* ==============================
   LOGIN / REGISTER SCREENS
============================== */

function showRegister() {

    document
        .getElementById("loginForm")
        .classList.add("hidden");

    document
        .getElementById("registerForm")
        .classList.remove("hidden");

    document
        .getElementById("authError")
        .textContent = "";
}


function showLogin() {

    document
        .getElementById("registerForm")
        .classList.add("hidden");

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    document
        .getElementById("authError")
        .textContent = "";
}


/* ==============================
   REGISTER
============================== */

async function register() {

    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const error =
        document.getElementById("authError");

    error.className = "error";
    error.textContent = "";

    if (!username) {
        error.textContent =
            "Please choose a username.";
        return;
    }

    if (password.length < 8) {
        error.textContent =
            "Password must be at least 8 characters.";
        return;
    }

    try {

        const data =
            await api("/api/register", {
                method: "POST",

                body: JSON.stringify({
                    username,
                    password
                })
            });

        localStorage.setItem(
            "voiceroom_token",
            data.token
        );

        showAccount(data.user);

    } catch (err) {

        error.textContent =
            err.message;
    }
}


/* ==============================
   LOGIN
============================== */

async function login() {

    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const error =
        document.getElementById("authError");

    error.className = "error";
    error.textContent = "";

    try {

        const data =
            await api("/api/login", {
                method: "POST",

                body: JSON.stringify({
                    username,
                    password
                })
            });

        localStorage.setItem(
            "voiceroom_token",
            data.token
        );

        showAccount(data.user);

    } catch (err) {

        error.textContent =
            err.message;
    }
}


/* ==============================
   SHOW ACCOUNT
============================== */

function showAccount(user) {

    document
        .getElementById("authScreen")
        .classList.add("hidden");

    document
        .getElementById("accountScreen")
        .classList.remove("hidden");

    document
        .getElementById("myUsername")
        .textContent =
            "@" + user.username;

    document
        .getElementById("myId")
        .textContent =
            user.id;

    loadFriends();
    loadRequests();
}


/* ==============================
   ADD FRIEND
============================== */

async function sendFriendRequest() {

    const username =
        document
            .getElementById("friendUsername")
            .value
            .trim();

    const error =
        document
            .getElementById("friendError");

    error.className = "error";
    error.textContent = "";

    if (!username) {

        error.textContent =
            "Enter a username first.";

        return;
    }

    try {

        await api(
            "/api/friends/request",
            {
                method: "POST",

                body: JSON.stringify({
                    username
                })
            }
        );

        document
            .getElementById("friendUsername")
            .value = "";

        error.className =
            "error success";

        error.textContent =
            "Friend request sent!";

    } catch (err) {

        error.textContent =
            err.message;
    }
}


/* ==============================
   REQUESTS
============================== */

async function loadRequests() {

    try {

        const data =
            await api(
                "/api/friends/requests"
            );

        const container =
            document.getElementById(
                "requests"
            );

        container.innerHTML = "";

        if (
            !data.requests ||
            data.requests.length === 0
        ) {

            container.innerHTML =
                '<div class="small">No pending requests.</div>';

            return;
        }

        data.requests.forEach(request => {

            const row =
                document.createElement("div");

            row.className = "friend";

            const name =
                document.createElement("div");

            name.textContent =
                "@" + request.username;

            row.appendChild(name);

            const button =
                document.createElement("button");

            button.textContent =
                "Accept";

            button.onclick =
                () => acceptRequest(request.id);

            row.appendChild(button);

            container.appendChild(row);
        });

    } catch (err) {

        console.error(
            "Could not load requests:",
            err
        );
    }
}


/* ==============================
   ACCEPT REQUEST
============================== */

async function acceptRequest(requestId) {

    try {

        await api(
            "/api/friends/accept",
            {
                method: "POST",

                body: JSON.stringify({
                    requestId
                })
            }
        );

        await loadRequests();
        await loadFriends();

    } catch (err) {

        alert(err.message);
    }
}


/* ==============================
   FRIENDS
============================== */

async function loadFriends() {

    try {

        const data =
            await api("/api/friends");

        const container =
            document.getElementById(
                "friends"
            );

        container.innerHTML = "";

        if (
            !data.friends ||
            data.friends.length === 0
        ) {

            container.innerHTML =
                '<div class="small">No friends yet.</div>';

            return;
        }

        data.friends.forEach(friend => {

            const row =
                document.createElement("div");

            row.className = "friend";

            row.textContent =
                "@" + friend.username;

            container.appendChild(row);
        });

    } catch (err) {

        console.error(
            "Could not load friends:",
            err
        );
    }
}


/* ==============================
   LOGOUT
============================== */

function logout() {

    localStorage.removeItem(
        "voiceroom_token"
    );

    location.reload();
}


/* ==============================
   CHECK EXISTING LOGIN
============================== */

async function checkExistingLogin() {

    const token =
        localStorage.getItem(
            "voiceroom_token"
        );

    if (!token) {
        return;
    }

    try {

        const data =
            await api("/api/me");

        showAccount(data.user);

    } catch {

        localStorage.removeItem(
            "voiceroom_token"
        );
    }
}

checkExistingLogin();

</script>

</body>
</html>
